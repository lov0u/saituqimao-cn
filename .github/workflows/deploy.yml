name: Build and Push to ACR

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: lov0u
  IMAGE_NAME: saituqimao
  SITE_SLUG: saituqimao
  PORT: 3004

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/saituqimao:latest
          crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/saituqimao:${{github.sha}}
        cache-from: type=gha
        cache-to: type=gha,mode=max
      env:
        DOCKER_USERNAME: ${{ secrets.ACR_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.ACR_PASSWORD }}

    - name: Deploy to server
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          echo "=== Deploy saituqimao ==="
          echo "Login ACR..."
          docker login crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}
          echo "Pull image..."
          docker pull crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/saituqimao:latest
          echo "Stop old container..."
          docker stop saituqimao || true
          docker rm saituqimao || true
          echo "Start new container..."
          docker run -d \
            --name saituqimao \
            --restart always \
            -p 3004:3000 \
            -e NODE_ENV=production \
            crpi-e6ejb7mi9ku0ep4b.cn-shanghai.personal.cr.aliyuncs.com/lov0u/saituqimao:latest
          echo "Prune old images..."
          docker image prune -f
          echo "Done!"